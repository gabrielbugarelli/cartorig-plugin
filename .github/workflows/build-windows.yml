name: Build Windows candidate
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: build / windows-installer
    if: ${{ github.event.repository.private == false }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build real GUI installer from checked-in source, including data and uninstaller
        shell: pwsh
        run: |
          if (-not (Test-Path "packaging/build-windows.ps1")) {
            throw "BLOCKED: real Windows installer build sources have not been implemented."
          }
          & ./packaging/build-windows.ps1
          if ($LASTEXITCODE -ne 0) { throw "Windows installer build failed." }
          if (-not (Test-Path "dist/manifest.json")) { throw "Missing release manifest." }
          $m = Get-Content -Raw "dist/manifest.json" | ConvertFrom-Json
          if ($m.commit_sha -ne "${{ github.sha }}" -or $m.run_id -ne "${{ github.run_id }}" -or $m.run_attempt -ne "${{ github.run_attempt }}" -or $m.version -ne "1.0.0") {
            throw "Build manifest must identify this exact Actions commit, run, attempt and version."
          }
          if (-not $m.installer_path -or -not $m.installer_sha256 -or -not $m.dataset_manifest_sha256) { throw "Incomplete release manifest." }
          $file = Join-Path "dist" $m.installer_path
          if (-not (Test-Path $file)) { throw "Real GUI installer missing." }
          if ((Get-Item $file).Length -gt 180MB) { throw "BLOCKED: installer exceeds conservative free-storage budget." }
          $h = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
          if ($h -ne $m.installer_sha256) { throw "Installer SHA-256 mismatch." }
          if (-not (Test-Path "dist/SHA256SUMS.txt")) { throw "Checksums file missing." }
      - name: Upload candidate only after checksum and size validation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cartorig-candidate-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
