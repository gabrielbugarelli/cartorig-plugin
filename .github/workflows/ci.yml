name: CI
on:
  push:
    branches: [main, 'ci/**', 'feat/**', 'fix/**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  audit-and-unit:
    name: ci / audit-and-unit
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install free Lua 5.1 interpreter for source tests (maintainer only)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
      - name: Parse every shipped Lua file, including host probe
        run: |
          for source in src/CartoRig/*.lua; do luac5.1 -p "$source"; done
          luac5.1 -p "host/CartoRig Host Probe.lua"
          luac5.1 -p "host/CartoRig Native Integration Probe.lua"
          luac5.1 -p "host/CartoRig.lua"
          luac5.1 -p "host/cartorig-dev.lua"
          luac5.1 -p "host/cartorig-dev-scene.lua"
          for fuse in fuses/*.fuse; do luac5.1 -p "$fuse"; done
          luac5.1 -p data/ne_50m_land.lua
      - name: Verify exact normative file and 40-test inventory
        run: python3 scripts/verify_repository.py
      - name: Test Python release gate and integrated Lua module tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: State evidence scope
        run: echo "Pure-source unit/integration checks only; no host acceptance approval."
