name: CI
on:
  push:
    branches: [main, 'ci/**', 'feat/**', 'fix/**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  audit-and-unit:
    name: ci / audit-and-unit
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify exact normative file and 40-test inventory
        run: python3 scripts/verify_repository.py
      - name: Test release gate and repository-independent unit code
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Note actual scope
        run: echo "Only structural and validator unit checks. No Fusion acceptance approval."
