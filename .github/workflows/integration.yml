name: Integration
on:
  push:
    branches: [main, 'ci/**', 'feat/**', 'fix/**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  integration:
    name: integration / real-source
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run actual non-host integration suite
        run: python3 scripts/run_integration.py
      - name: No host substitution
        run: echo "This job cannot approve Windows + licensed Fusion Studio 20 tests."
