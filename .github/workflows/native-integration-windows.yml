name: Milestone A Native Integration Windows
on:
  push:
    branches: ['feat/milestone-a-native-graph-validation']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-probe:
    name: build / native-integration-and-install-validation
    if: ${{ github.event.repository.private == false }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install free NSIS CLI toolchain
        shell: pwsh
        run: choco install nsis --yes --no-progress --limit-output
      - name: Compile diagnostic GUI installer from source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { throw "NSIS compiler not found." }
          $outfile = Join-Path (Get-Location).Path "dist\CartoRig-NativeIntegration-0.2-win64.exe"
          & $nsis '/V3' "/DOUTPUTFILE=$outfile" 'packaging\native-integration.nsi'
          if ($LASTEXITCODE -ne 0) { throw "NSIS build failed." }
          $file = "dist\CartoRig-NativeIntegration-0.2-win64.exe"
          if (-not (Test-Path $file)) { throw "No GUI installer generated." }
          $size = (Get-Item $file).Length
          if ($size -gt 5MB -or $size -le 0) { throw "Invalid probe size or storage budget exceeded." }
          $sha = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
          "$sha  CartoRig-NativeIntegration-0.2-win64.exe" | Set-Content -Encoding ascii "dist\SHA256SUMS.txt"
          $m = @{
            kind="native-api-diagnostic-not-v1"
            version="0.2.0"
            commit_sha="$env:GITHUB_SHA"
            run_id="$env:GITHUB_RUN_ID"
            run_attempt="$env:GITHUB_RUN_ATTEMPT"
            file="CartoRig-NativeIntegration-0.2-win64.exe"
            sha256=$sha
          }
          $m | ConvertTo-Json | Set-Content -Encoding utf8 "dist\manifest.json"
      - name: Validate silent installation and uninstallation on clean Windows runner
        shell: pwsh
        run: |
          $setup = (Resolve-Path "dist\CartoRig-NativeIntegration-0.2-win64.exe").Path
          $script = Join-Path $env:APPDATA "Blackmagic Design\DaVinci Resolve\Support\Fusion\Scripts\Comp\CartoRig Native Integration Probe.lua"
          $remove = Join-Path $env:LOCALAPPDATA "CartoRig\NativeIntegrationProbe\Uninstall-NativeIntegration.exe"
          $library = Join-Path $env:APPDATA "Blackmagic Design\DaVinci Resolve\Support\Fusion\Scripts\Comp\CartoRigProbe\native_probe.lua"
          if ((Test-Path $script) -or (Test-Path $library)) { throw "Runner already contains probe files." }
          $p = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path $script) -or -not (Test-Path $remove)) { throw "Probe installation failed." }
          $p = Start-Process -FilePath $remove -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or (Test-Path $script) -or (Test-Path $library) -or (Test-Path $remove)) { throw "Probe uninstallation failed." }
          "Windows diagnostic install/uninstall PASS (Resolve Studio 20 execution NOT RUN)" | Set-Content "dist\package-validation.txt"
      - name: Upload verified diagnostic build only, not a release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cartorig-milestone-a-native-integration-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
