name: Package validation
on:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    name: package / install-uninstall
    if: ${{ github.event.repository.private == false }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download exact candidate from current workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cartorig-candidate-${{ github.run_attempt }}
          path: candidate
      - name: Validate real package contents, GUI install, uninstall and clean state
        shell: pwsh
        run: |
          if (-not (Test-Path "packaging/validate-windows.ps1")) {
            throw "BLOCKED: real Windows installation/uninstallation validation not implemented."
          }
          & ./packaging/validate-windows.ps1 -PackageRoot "candidate"
          if ($LASTEXITCODE -ne 0) { throw "Package validation failed." }
          if (-not (Test-Path "candidate/manifest.json")) { throw "Missing candidate manifest." }
