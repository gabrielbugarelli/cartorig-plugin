name: CartoRig Windows Installer

on:
  workflow_dispatch:
  # Allow a build-only run when this packaging workflow itself changes.
  # Only installer packaging is run here. This workflow revision packages the
  # Include native Region palette expressions, lexical API binding fix, and explicit Scene repair.
  # GitHub Actions only packages the reviewed Windows installer; it runs no tests.
  # No tests run in GitHub Actions; other source pushes do not trigger builds.
  push:
    branches:
      - feat/milestone-a-regions
    paths:
      - .github/workflows/scene-timeline-windows.yml

permissions:
  contents: read

jobs:
  build-installer:
    name: build installer only
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      NATURAL_EARTH_COMMIT: f1890d9f152c896d250a77557a5751a93d494776
    steps:
      - name: Checkout CartoRig source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install build-only dependencies
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          python -m pip install --disable-pip-version-check --no-input pyshp==2.3.1

      - name: Materialize pinned Natural Earth assets for packaging
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/natural-earth,build/cartorig-data | Out-Null
          git -C build/natural-earth init -q
          git -C build/natural-earth remote add origin https://github.com/nvkelso/natural-earth-vector.git
          git -C build/natural-earth fetch --depth=1 origin $env:NATURAL_EARTH_COMMIT
          git -C build/natural-earth checkout --detach -q FETCH_HEAD
          python tools/build_natural_earth.py `
            --source-root build/natural-earth `
            --output build/cartorig-data `
            --source-commit $env:NATURAL_EARTH_COMMIT

      - name: Compile CartoRig installer
        shell: pwsh
        run: |
          $makensisCommand=Get-Command makensis.exe -ErrorAction SilentlyContinue
          $makensis=if ($makensisCommand) { $makensisCommand.Source } else { $null }
          if (!$makensis) {
            $candidate=Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
            if (Test-Path -LiteralPath $candidate -PathType Leaf) {
              $makensis=$candidate
            }
          }
          if (!$makensis -or !(Test-Path -LiteralPath $makensis -PathType Leaf)) {
            throw 'NSIS makensis.exe not found after Chocolatey installation'
          }
          Write-Host "Using NSIS compiler: $makensis"
          New-Item -ItemType Directory -Force dist | Out-Null
          & $makensis /V3 "/DOUTPUTFILE=$PWD\dist\cartorig-dev-0.7.0-win64.exe" `
            "/DBUILDSHA=$env:GITHUB_SHA" packaging\cartorig-preview.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create build identity files
        shell: pwsh
        run: |
          $installer=Resolve-Path dist/cartorig-dev-0.7.0-win64.exe
          $sha=(Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  cartorig-dev-0.7.0-win64.exe" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          @{
            version='0.7.0'
            commit=$env:GITHUB_SHA
            natural_earth_commit=$env:NATURAL_EARTH_COMMIT
            installer='cartorig-dev-0.7.0-win64.exe'
            sha256=$sha
            purpose='build-only; tests executed outside GitHub Actions'
          } | ConvertTo-Json | Set-Content -Encoding utf8 dist/manifest.json

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cartorig-dev-0.7.0-${{ github.sha }}
          path: dist/
          retention-days: 7
          if-no-files-found: error
