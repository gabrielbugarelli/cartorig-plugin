name: cartorig-dev Scene Timeline Windows
on:
  push:
    branches: ['feat/scene-per-timeline-composition', 'fix/resolve-context-type-guard-061', 'fix/reviewed-timeline-safety-063']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    name: windows / scene-timeline-install-and-migration
    if: ${{ github.event.repository.private == false }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install free NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress --limit-output
      - name: Compile historical 0.5.2/0.6.0/0.6.1/0.6.2 and new 0.6.3 installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist,fixture | Out-Null
          $exe="${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $exe)) {throw 'NSIS unavailable'}
          $root=(Get-Location).Path
          $old=Join-Path $root 'fixture\cartorig-dev-0.5.2.exe'
          $old060=Join-Path $root 'fixture\cartorig-dev-0.6.0.exe'
          $old061=Join-Path $root 'fixture\cartorig-dev-0.6.1.exe'
          $old062=Join-Path $root 'fixture\cartorig-dev-0.6.2.exe'
          $new=Join-Path $root 'dist\cartorig-dev-0.6.3-win64.exe'
          & $exe /V2 "/DOUTPUTFILE=$old" packaging\legacy-preview-0.5.2.nsi
          if ($LASTEXITCODE -ne 0) {throw 'Legacy compile failed'}
          & $exe /V2 "/DOUTPUTFILE=$old060" packaging\legacy-preview-0.6.0.nsi
          if ($LASTEXITCODE -ne 0) {throw 'Authentic old 0.6.0 fixture compile failed'}
          & $exe /V2 "/DOUTPUTFILE=$old061" packaging\legacy-preview-0.6.1.nsi
          if ($LASTEXITCODE -ne 0) {throw 'Authentic old 0.6.1 fixture compile failed'}
          & $exe /V2 "/DOUTPUTFILE=$old062" packaging\legacy-preview-0.6.2.nsi
          if ($LASTEXITCODE -ne 0) {throw 'Authentic old 0.6.2 fixture compile failed'}
          & $exe /V3 "/DOUTPUTFILE=$new" packaging\cartorig-preview.nsi
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $new)) {throw 'Preview compile failed'}
          $sha=(Get-FileHash -Algorithm SHA256 $new).Hash.ToLowerInvariant()
          "$sha  cartorig-dev-0.6.3-win64.exe" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          @{version='0.6.3';type='development-only';commit_sha="$env:GITHUB_SHA";sha256=$sha;script='Utility\cartorig-dev.lua'} |
            ConvertTo-Json | Set-Content -Encoding utf8 dist/manifest.json
      - name: Validate old-to-new migration, single Utility menu, reinstall, uninstall
        shell: pwsh
        run: |
          $root=Join-Path $env:APPDATA 'Blackmagic Design\DaVinci Resolve\Support\Fusion\Scripts'
          $comp=Join-Path $root 'Comp\cartorig-dev.lua'
          $utility=Join-Path $root 'Utility\cartorig-dev.lua'
          $backup="$comp.migrated-060"
          $app=Join-Path $env:LOCALAPPDATA 'CartoRig\App'
          $new=(Resolve-Path dist/cartorig-dev-0.6.3-win64.exe).Path
          $old=(Resolve-Path fixture/cartorig-dev-0.5.2.exe).Path
          $old060=(Resolve-Path fixture/cartorig-dev-0.6.0.exe).Path
          $old061=(Resolve-Path fixture/cartorig-dev-0.6.1.exe).Path
          $old062=(Resolve-Path fixture/cartorig-dev-0.6.2.exe).Path
          $uninstall=Join-Path $app 'Uninstall-CartoRig.exe'
          $module=Join-Path $app 'lua\CartoRig\timeline_service.lua'
          $ui=Join-Path $app 'lua\cartorig_scene_ui.lua'
          $foreign=Join-Path $root 'Comp\Other Editor.lua'
          New-Item -ItemType Directory -Force (Split-Path -Parent $foreign) | Out-Null
          [IO.File]::WriteAllText($foreign,'Unrelated editor script: leave unchanged')
          $hash=(Get-FileHash -Algorithm SHA256 $foreign).Hash
          $p=Start-Process -FilePath $old -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path $comp)) {throw 'Cannot reproduce historical installation'}
          # Reproduce the 0.6.0 installation that accepted numeric Resolve globals.
          $p=Start-Process -FilePath $old060 -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path $utility) -or (Test-Path $comp)) {
            throw 'Could not reproduce historical 0.6.0 Utility installation'
          }
          $originalUi=(Get-FileHash host/legacy-scene-ui-0.6.0.lua -Algorithm SHA256).Hash
          $originalService=(Get-FileHash src/CartoRig/legacy_timeline_service_0.6.0.lua -Algorithm SHA256).Hash
          if ((Get-FileHash $ui -Algorithm SHA256).Hash -ne $originalUi) {throw 'Old 0.6.0 UI fixture was not genuinely installed'}
          if ((Get-FileHash $module -Algorithm SHA256).Hash -ne $originalService) {throw 'Old 0.6.0 service fixture was not genuinely installed'}
          # Reproduce the real 0.6.1 package that still called TimelineItem:GetStart/GetEnd
          # without the explicit subframe_precision flag.
          $p=Start-Process -FilePath $old061 -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path $utility)) {
            throw 'Could not reproduce historical 0.6.1 Utility installation'
          }
          $service061=(Get-FileHash src/CartoRig/legacy_timeline_service_0.6.1.lua -Algorithm SHA256).Hash
          if ((Get-FileHash $module -Algorithm SHA256).Hash -ne $service061) {
            throw 'Old 0.6.1 TimelineService fixture was not genuinely installed'
          }
          # Reproduce the authentic 0.6.2 package that still had incomplete
          # timeline rollback/MediaOut/author-node/uninstaller safety.
          $p=Start-Process -FilePath $old062 -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path $utility)) {
            throw 'Could not reproduce historical 0.6.2 Utility installation'
          }
          $service062=(Get-FileHash src/CartoRig/legacy_timeline_service_0.6.2.lua -Algorithm SHA256).Hash
          $factory062=(Get-FileHash src/CartoRig/legacy_node_factory_0.6.2.lua -Algorithm SHA256).Hash
          if ((Get-FileHash $module -Algorithm SHA256).Hash -ne $service062) {
            throw 'Old 0.6.2 TimelineService fixture was not genuinely installed'
          }
          if ((Get-FileHash (Join-Path $app 'lua\CartoRig\node_factory.lua') -Algorithm SHA256).Hash -ne $factory062) {
            throw 'Old 0.6.2 NodeFactory fixture was not genuinely installed'
          }
          # A same-name Comp script appearing beside the managed Utility entry is
          # not owned by 0.6.3. Upgrade must stop before changing either file.
          $conflictComp=Join-Path $root 'Comp\cartorig-dev.lua'
          [IO.File]::WriteAllText($conflictComp,'external duplicate cartorig-dev; preserve me')
          $conflictHash=(Get-FileHash $conflictComp -Algorithm SHA256).Hash
          $preUpgradeUtilityHash=(Get-FileHash $utility -Algorithm SHA256).Hash
          $preUpgradeServiceHash=(Get-FileHash $module -Algorithm SHA256).Hash
          $blocked=Start-Process -FilePath $new -ArgumentList '/S' -Wait -PassThru
          if (!(Test-Path $conflictComp) -or (Get-FileHash $conflictComp -Algorithm SHA256).Hash -ne $conflictHash) {
            throw '0.6.3 changed conflicting external Comp/cartorig-dev.lua'
          }
          if ((Get-FileHash $utility -Algorithm SHA256).Hash -ne $preUpgradeUtilityHash -or
              (Get-FileHash $module -Algorithm SHA256).Hash -ne $preUpgradeServiceHash) {
            throw 'Blocked duplicate-entry upgrade modified the installed 0.6.2 runtime'
          }
          Remove-Item -LiteralPath $conflictComp -Force
          for ($i=0; $i -lt 2; $i++) {
            $p=Start-Process -FilePath $new -ArgumentList '/S' -Wait -PassThru
            if ($p.ExitCode -ne 0) {throw "Preview install iteration $i failed"}
            if (!(Test-Path $utility) -or (Test-Path $comp) -or (Test-Path $backup)) {throw 'Utility migration or verified backup retirement failed'}
            if ((Get-FileHash $utility -Algorithm SHA256).Hash -ne (Get-FileHash host/cartorig-dev-launcher.lua -Algorithm SHA256).Hash) {throw 'Launcher hash mismatch'}
            if (!(Test-Path $module) -or (Get-FileHash $module -Algorithm SHA256).Hash -ne (Get-FileHash src/CartoRig/timeline_service.lua -Algorithm SHA256).Hash) {throw 'TimelineService mismatch'}
            if (!(Test-Path $ui) -or (Get-FileHash $ui -Algorithm SHA256).Hash -ne (Get-FileHash host/cartorig-dev-scene.lua -Algorithm SHA256).Hash) {throw 'Scene UI mismatch'}
            $all=@(Get-ChildItem -Path $root -Recurse -File -Filter cartorig-dev.lua)
            if ($all.Count -ne 1 -or $all[0].FullName -ne $utility) {throw 'Not exactly one Scripts menu entry'}
            if ((Test-Path "$utility.pending") -or (Test-Path "$utility.backup")) {throw 'Launcher staging residue'}
            $record=[IO.File]::ReadAllText((Join-Path $app 'install-location.txt'))
            if (!$record.Contains($utility) -or !$record.Contains('0.6.3')) {throw 'Installation record stale'}
            if ((Get-FileHash $foreign -Algorithm SHA256).Hash -ne $hash) {throw 'Unrelated script overwritten'}
          }
          # The current Utility install does not own an active Comp/cartorig-dev.lua.
          # A same-name script created after installation must survive uninstall.
          $foreignComp=Join-Path $root 'Comp\cartorig-dev.lua'
          [IO.File]::WriteAllText($foreignComp,'external same-name script, not owned by 0.6.3')
          $foreignCompHash=(Get-FileHash $foreignComp -Algorithm SHA256).Hash
          $p=Start-Process -FilePath $uninstall -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or (Test-Path $utility) -or (Test-Path $backup) -or (Test-Path $module)) {throw 'Upgrade uninstall failed'}
          if (!(Test-Path $foreignComp) -or (Get-FileHash $foreignComp -Algorithm SHA256).Hash -ne $foreignCompHash) {
            throw 'Uninstaller deleted or changed unowned Comp/cartorig-dev.lua'
          }
          Remove-Item -LiteralPath $foreignComp -Force
          $p=Start-Process -FilePath $new -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path $utility) -or (Test-Path $comp)) {throw 'Clean install failed'}
          $p=Start-Process -FilePath $uninstall -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or (Test-Path $utility)) {throw 'Clean uninstall failed'}
          if ((Get-FileHash $foreign -Algorithm SHA256).Hash -ne $hash) {throw 'Foreign script affected'}

          # Direct recognized legacy migration: authentic 0.5.2 Comp launcher must
          # pass normalized SHA verification and migrate to the one Utility entry.
          $p=Start-Process -FilePath $old -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path $comp) -or (Test-Path $utility)) {throw 'Direct legacy fixture setup failed'}
          $legacyHash=(Get-FileHash $comp -Algorithm SHA256).Hash
          $unknownPending="$comp.pending"
          [IO.File]::WriteAllText($unknownPending,'unrecognized staged launcher; preserve me')
          $unknownPendingHash=(Get-FileHash $unknownPending -Algorithm SHA256).Hash
          $blockedPending=Start-Process -FilePath $new -ArgumentList '/S' -Wait -PassThru
          if (!(Test-Path $comp) -or (Get-FileHash $comp -Algorithm SHA256).Hash -ne $legacyHash) {
            throw 'Blocked staging verification changed recognized active legacy launcher'
          }
          if (!(Test-Path $unknownPending) -or (Get-FileHash $unknownPending -Algorithm SHA256).Hash -ne $unknownPendingHash) {
            throw '0.6.3 deleted or changed unrecognized legacy pending launcher'
          }
          if (Test-Path $utility) {throw 'Utility activated despite unrecognized legacy pending launcher'}
          Remove-Item -LiteralPath $unknownPending -Force
          $p=Start-Process -FilePath $new -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path $utility) -or (Test-Path $comp) -or (Test-Path $backup)) {
            throw 'Verified 0.5.2 legacy launcher did not migrate cleanly to 0.6.3'
          }
          $p=Start-Process -FilePath $uninstall -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or (Test-Path $utility) -or (Test-Path $backup)) {throw 'Direct migration uninstall failed'}

          # Modified legacy launcher: same path and managed uninstall record are
          # insufficient ownership proof. New installer must preserve and abort.
          $p=Start-Process -FilePath $old -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path $comp)) {throw 'Modified legacy fixture setup failed'}
          Add-Content -LiteralPath $comp -Value '-- external modification after historical install'
          $modifiedLegacyHash=(Get-FileHash $comp -Algorithm SHA256).Hash
          $blockedLegacy=Start-Process -FilePath $new -ArgumentList '/S' -Wait -PassThru
          if (!(Test-Path $comp) -or (Get-FileHash $comp -Algorithm SHA256).Hash -ne $modifiedLegacyHash) {
            throw '0.6.3 changed unrecognized/modified legacy Comp launcher'
          }
          if (Test-Path $utility) {throw '0.6.3 activated Utility despite unverified legacy Comp launcher'}
          $p=Start-Process -FilePath $uninstall -ArgumentList '/S' -Wait -PassThru
          if ((Test-Path $utility)) {throw 'Cleanup after modified legacy fixture failed'}

          'PASS: historical migration through 0.6.3, exact legacy SHA ownership, duplicate-entry blocking, repeat install, clean install/uninstall, same-name and unrelated foreign scripts preserved; Resolve host NOT RUN.' |
            Set-Content dist/package-validation.txt
      - name: Include read-only installation diagnostic
        shell: pwsh
        run: |
          Copy-Item support/cartorig-dev-diagnose.ps1,support/verificar-cartorig-dev.cmd,support/README.md -Destination dist
      - name: Upload verified package only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cartorig-dev-timeline-${{ github.sha }}
          path: dist/
          retention-days: 7
          if-no-files-found: error
